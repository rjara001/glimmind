name: Deploy with Version Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need previous commit for diff
      
      - name: Check version bumped
        run: |
          if ! git diff --name-only HEAD~1 HEAD | grep -qE "package\.json|src/constants/version\.ts"; then
            echo "❌ ERROR: Version not bumped in package.json or src/constants/version.ts"
            echo "Run: npm run version:bump"
            exit 1
          fi
          echo "✅ Version bumped in both files"

  deploy:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: fladycard-22a3e
          channelId: live